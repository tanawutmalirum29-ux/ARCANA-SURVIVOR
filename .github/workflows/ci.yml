name: Arcana Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  role-file-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce exclusive team file ownership
        env:
          TEAM_BRANCH: ${{ github.event.pull_request.head.ref }}
          TEAM_BASE: ${{ github.event.pull_request.base.sha }}
          TEAM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-team-scope.mjs

  unit-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic simulation and save tests
        run: npm test
      - name: Build static demo
        run: npm run build
      - name: Validate generated entrypoint
        run: test -s dist/index.html && test -s dist/src/engine.js

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Start real HTTP server
        run: |
          node scripts/dev-server.mjs > /tmp/arcana-dev-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arcana-dev-server.log
          exit 1
      - name: Chromium + WebKit on five viewport sizes
        run: python scripts/browser_qa.py --served --browsers chromium webkit
